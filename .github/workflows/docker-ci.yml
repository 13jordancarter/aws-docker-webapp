name: Docker CI


on: 
  push:
    branches:

      -main


jobs: 
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aws-docker-webapp . 

      - name: Verify Docker image
        run: docker images aws-docker-webapp
